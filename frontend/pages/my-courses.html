<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="logo">CS</div>
            <div>CS TECHNOLOGIES<small>RAWALPINDI</small></div>
        </div>

        <a href="student-dashboard.html" class="nav-link-custom">Dashboard</a>
        <a href="my-courses.html" class="nav-link-custom active">My Courses</a>
        <a href="course-information.html" class="nav-link-custom">Feedback</a>
        <a href="profile-settings.html" class="nav-link-custom">Profile</a>

        <div class="logout">
            <a href="login.html" class="nav-link-custom" id="logoutBtn">Logout</a>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="brand">
                <div class="logo">CS</div>
                <div>CS TECHNOLOGIES<small>RAWALPINDI</small></div>
            </div>
            <b id="studentName">Student</b>
        </header>

        <section class="content">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="title">My Courses</h2>
                    <p class="muted">All courses you are enrolled in.</p>
                </div>

                <input
                    id="courseSearch"
                    class="form-control"
                    style="max-width:260px"
                    placeholder="Search course..."
                >
            </div>

            <div id="coursesMessage" class="alert alert-info">
                Loading your courses...
            </div>

            <div id="coursesContainer" class="row g-4"></div>
        </section>
    </main>

    <script src="../js/app.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", async function () {
        const token = localStorage.getItem("token");
        const container = document.getElementById("coursesContainer");
        const message = document.getElementById("coursesMessage");
        const search = document.getElementById("courseSearch");

        let courses = [];

        if (!token) {
            message.className = "alert alert-warning";
            message.textContent = "Please log in to view your courses.";
            return;
        }

        document.getElementById("logoutBtn").addEventListener("click", function () {
            localStorage.removeItem("token");
        });

        function renderCourses() {
            const keyword = search.value.trim().toLowerCase();

            const filtered = courses.filter(course =>
                String(course.course_title || "").toLowerCase().includes(keyword) ||
                String(course.batch_name || "").toLowerCase().includes(keyword) ||
                String(course.instructor_name || "").toLowerCase().includes(keyword)
            );

            container.innerHTML = "";

            if (filtered.length === 0) {
                message.className = "alert alert-info";
                message.textContent = courses.length
                    ? "No matching courses found."
                    : "You are not enrolled in any courses yet.";
                message.style.display = "block";
                return;
            }

            message.style.display = "none";

            filtered.forEach(course => {
                const status = course.status || "No active feedback";
                const completed = status === "Completed";
                const pending = status === "Pending";

                const badgeClass = completed
                    ? "badge-green"
                    : pending
                        ? "badge-orange"
                        : "badge-soft";

                const initials = String(course.course_title || "C")
                    .split(/\s+/)
                    .slice(0, 2)
                    .map(word => word.charAt(0))
                    .join("")
                    .toUpperCase();

                const card = document.createElement("div");
                card.className = "col-md-6 col-xl-3";

                card.innerHTML = `
                    <div class="card-custom h-100">
                        <div class="icon-box mb-3">${initials}</div>
                        <h5 class="title"></h5>
                        <p class="muted small">
                            Batch: <span class="batchName"></span><br>
                            Instructor: <span class="instructorName"></span>
                        </p>
                        <span class="badge-soft ${badgeClass} statusBadge"></span>
                        <button class="btn btn-navy btn-sm w-100 mt-4 courseAction"></button>
                    </div>
                `;

                card.querySelector("h5").textContent = course.course_title || "Course";
                card.querySelector(".batchName").textContent = course.batch_name || "Not assigned";
                card.querySelector(".instructorName").textContent = course.instructor_name || "Not assigned";
                card.querySelector(".statusBadge").textContent = status;

                const button = card.querySelector(".courseAction");

                if (pending) {
                    button.textContent = "Give Feedback";
                    button.addEventListener("click", function () {
                        window.location.href =
                            "course-information.html?courseId=" +
                            encodeURIComponent(course.course_id) +
                            "&batchId=" +
                            encodeURIComponent(course.batch_id);
                    });
                } else if (completed) {
                    button.textContent = "Feedback Completed";
                    button.disabled = true;
                } else {
                    button.textContent = "No Active Feedback";
                    button.disabled = true;
                }

                container.appendChild(card);
            });
        }

        search.addEventListener("input", renderCourses);

        try {
            const response = await fetch("http://localhost:5000/api/students/my-courses", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                }
            });

            const result = await response.json();

            if (response.status === 401) {
                message.className = "alert alert-warning";
                message.textContent = "Your login session expired. Please log in again.";
                return;
            }

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Could not load courses.");
            }

            courses = result.data || [];
            renderCourses();

        } catch (error) {
            console.error("My Courses error:", error);
            message.className = "alert alert-danger";
            message.textContent = error.message || "Failed to load courses. Please try again.";
        }
    });
    </script>
</body>
</html>
