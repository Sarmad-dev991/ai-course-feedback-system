
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="logo">CS</div>
            <div>
                CS TECHNOLOGIES
                <small>RAWALPINDI</small>
            </div>
        </div>

        <nav id="sidebarLinks">
            <!-- Links will be generated according to the logged-in role -->
        </nav>

        <div class="logout">
            <a href="#" id="logoutBtn" class="nav-link-custom">Logout</a>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="brand">
                <div class="logo">CS</div>
                <div>
                    CS TECHNOLOGIES
                    <small>RAWALPINDI</small>
                </div>
            </div>

            <b id="topbarName">Loading profile...</b>
        </header>

        <section class="content">
            <h2 class="title">Profile & Settings</h2>
            <p class="muted">Manage your account information and preferences.</p>

            <div id="messageBox" class="alert d-none" role="alert"></div>

            <div class="row g-4 mt-2">

                <div class="col-lg-7">
                    <div class="card-custom">

                        <h5 class="title">Profile</h5>

                        <form id="profileForm">
                            <div class="row g-3 mt-2">

                                <div class="col-md-6">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input
                                        type="text"
                                        id="fullName"
                                        class="form-control"
                                        maxlength="100"
                                        required
                                        autocomplete="name">
                                </div>

                                <div class="col-md-6">
                                    <label for="studentId" id="idLabel" class="form-label">
                                        Student ID
                                    </label>
                                    <input
                                        type="text"
                                        id="studentId"
                                        class="form-control"
                                        readonly>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        required
                                        autocomplete="email">
                                </div>

                                <div class="col-md-6">
                                    <label for="role" class="form-label">Role</label>
                                    <input
                                        type="text"
                                        id="role"
                                        class="form-control"
                                        readonly>
                                </div>

                            </div>

                            <button
                                type="submit"
                                id="saveBtn"
                                class="btn btn-primary mt-4">
                                Save Changes
                            </button>
                        </form>

                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card-custom">

                        <h5 class="title">Privacy</h5>

                        <div class="form-check form-switch mt-3">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="anonymousFeedback">

                            <label
                                class="form-check-label"
                                for="anonymousFeedback">
                                Allow anonymous feedback where enabled
                            </label>
                        </div>

                        <small class="text-muted d-block mt-2">
                            This preference is not saved yet. It will take effect
                            after privacy settings are connected to the backend.
                        </small>

                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        const API_URL = "http://localhost:5000/api/users";

        const token = localStorage.getItem("token");

        const profileForm = document.getElementById("profileForm");
        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("email");
        const studentIdInput = document.getElementById("studentId");
        const idLabel = document.getElementById("idLabel");
        const roleInput = document.getElementById("role");
        const topbarName = document.getElementById("topbarName");
        const messageBox = document.getElementById("messageBox");
        const saveBtn = document.getElementById("saveBtn");
        const sidebarLinks = document.getElementById("sidebarLinks");

        let currentUser = null;

        function showMessage(message, type = "success") {
            messageBox.textContent = message;
            messageBox.className = `alert alert-${type}`;
        }

        function hideMessage() {
            messageBox.textContent = "";
            messageBox.className = "alert d-none";
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", (event) => {
            event.preventDefault();
            logout();
        });

        function createSidebar(role) {
            const normalizedRole = String(role || "").toLowerCase();

            let links = [];

            if (normalizedRole === "instructor") {
                links = [
                    { text: "Dashboard", href: "instructor-dashboard.html" },
                    { text: "AI Insights", href: "ai-insights.html" },
                    { text: "Reports", href: "reports.html" },
                    { text: "Profile", href: "profile-settings.html", active: true }
                ];
            } else if (normalizedRole === "admin") {
                links = [
                    { text: "Dashboard", href: "admin-dashboard.html" },
                    { text: "Profile", href: "profile-settings.html", active: true }
                ];
            } else {
                links = [
                    { text: "Dashboard", href: "student-dashboard.html" },
                    { text: "My Courses", href: "my-courses.html" },
                    { text: "Profile", href: "profile-settings.html", active: true }
                ];
            }

            sidebarLinks.replaceChildren();

            links.forEach((item) => {
                const link = document.createElement("a");
                link.href = item.href;
                link.className = "nav-link-custom" + (item.active ? " active" : "");
                link.textContent = item.text;
                sidebarLinks.appendChild(link);
            });
        }

        async function loadProfile() {
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/me`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok || !data.success || !data.user) {
                    throw new Error(data.message || "Could not load profile.");
                }

                currentUser = data.user;

                fullNameInput.value = currentUser.name || "";

                // temporarily code
                console.log("Profile elements:", {
    fullNameInput,
    emailInput,
    studentIdInput,
    roleInput
});

console.log("Values being displayed:", {
    name: currentUser.name,
    email: currentUser.email,
    role: currentUser.role
});

// yahan tak


                emailInput.value = currentUser.email || "";
                roleInput.value = currentUser.role || "";

                const isStudent =
                    String(currentUser.role || "").toLowerCase() === "student";

                idLabel.textContent = isStudent ? "Student ID" : "Student ID";
                studentIdInput.value = isStudent
                    ? (currentUser.student_id || "Not assigned")
                    : "Not applicable";

                topbarName.textContent = currentUser.name || "User";

                createSidebar(currentUser.role);

                // Keep the locally stored user display data up to date.
                const storedUser = JSON.parse(localStorage.getItem("user") || "{}");

                localStorage.setItem("user", JSON.stringify({
                    ...storedUser,
                    id: currentUser.id,
                    name: currentUser.name,
                    email: currentUser.email,
                    role: currentUser.role,
                    student_id: currentUser.student_id || null
                }));

            } catch (error) {
                console.error("Profile loading error:", error);
                showMessage(
                    error.message || "Unable to load profile. Check that the backend is running.",
                    "danger"
                );
            }
        }

        profileForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideMessage();

            if (!token || !currentUser) {
                showMessage("Your profile has not loaded. Please log in again.", "warning");
                return;
            }

            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name || !email) {
                showMessage("Please enter both name and email.", "warning");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";

            try {
                const response = await fetch(`${API_URL}/me`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not update profile.");
                }

                currentUser = data.user || {
                    ...currentUser,
                    name,
                    email
                };

                fullNameInput.value = currentUser.name || name;
                emailInput.value = currentUser.email || email;
                topbarName.textContent = currentUser.name || name;

                const storedUser = JSON.parse(localStorage.getItem("user") || "{}");

                localStorage.setItem("user", JSON.stringify({
                    ...storedUser,
                    id: currentUser.id,
                    name: currentUser.name,
                    email: currentUser.email,
                    role: currentUser.role,
                    student_id: currentUser.student_id || null
                }));

                showMessage(data.message || "Profile updated successfully.", "success");

            } catch (error) {
                console.error("Profile update error:", error);
                showMessage(error.message || "Unable to save changes.", "danger");
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Changes";
            }
        });

        loadProfile();
    </script>

    <script src="../js/app.js"></script>

</body>
</html>
