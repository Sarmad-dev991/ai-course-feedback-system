<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">CS</div>

            <div>
                CS TECHNOLOGIES
                <small>RAWALPINDI</small>
            </div>
        </div>

        <a href="student-dashboard.html" class="nav-link-custom">Dashboard</a>
        <a href="my-courses.html" class="nav-link-custom">My Courses</a>
        <a href="profile-settings.html" class="nav-link-custom active">Profile</a>
        <div class="logout">
            <a href="login.html" class="nav-link-custom">
                Logout
            </a>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="brand">
                <div class="logo">
                    CS
                </div>

                <div>
                    CS TECHNOLOGIES
                    <small>RAWALPINDI</small>
                </div>

            </div>
            <b>Ali Hassan</b>
        </header>

        <section class="content">

            <h2 class="title">Profile & Settings</h2>
            <p class="muted">Manage your account information and preferences.</p>

            <div class="row g-4 mt-2">

                <div class="col-lg-7">

                    <div class="card-custom">

                        <h5 class="title">Profile</h5>

                        <div class="row g-3 mt-2">

                            <div class="col-md-6">

                                <label>Full Name</label>
                                <input class="form-control" value="Ali Hassan">
                            </div>

                            <div class="col-md-6">
                                <label>Student ID</label>
                                <input class="form-control" value="ST-1024" readonly>
                            </div>

                            <div class="col-md-6">
                                <label>Email</label>
                                <input class="form-control" value="student@example.com">
                            </div>

                            <div class="col-md-6">
                                <label>Role</label>
                                <input class="form-control" value="Student" readonly>
                            </div>

                        </div>

                        <button class="btn btn-primary mt-4">Save Changes</button>
                    </div>

                </div>

                <div class="col-lg-5">
                    <div class="card-custom">

                        <h5 class="title">Privacy</h5>

                        <div class="form-check form-switch mt-3">

                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Allow anonymous feedback where enabled</label>
                        </div>

                    </div>
                </div>

            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>

</body>

</html>
